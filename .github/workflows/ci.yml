name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      # 临时非阻断：全仓 stylelint 尚有约 3000 条历史遗留（空行/引号/前缀等格式问题），
      # 待专项清理完成后删除 continue-on-error，恢复为硬性门禁。
      - name: Lint CSS
        run: npm run lint:css:check
        continue-on-error: true

      - name: Test
        run: npm run test:run

      # 临时非阻断：knip 现存 176 个未使用文件 / 110 个未使用导出，属待清债务。
      # 清理完成后删除 continue-on-error，恢复为硬性门禁。
      - name: Knip
        run: npm run knip
        continue-on-error: true

      - name: Build
        run: npm run build